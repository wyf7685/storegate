[project]
name = "storegate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "a2wsgi>=1.10.10",
  "aioftp>=0.27.2",
  "anyio>=4.14.1",
  "asyncssh>=2.24.0",
  "ayafileio>=1.4.7",
  "expiringdictx>=1.1.0",
  "httpx[http2]>=0.28.1",
  "loguru>=0.7.3",
  "pydantic>=2.13.4",
  "redis>=8.0.1",
  "uvicorn[standard]>=0.50.2",
  "uvloop>=0.22.1 ; sys_platform != 'win32'",
  "winloop>=0.6.3 ; sys_platform == 'win32'",
  "wsgidav>=4.3.5",
]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["prek>=0.4.9", "ruff>=0.15.21", "ty>=0.0.60"]
test = [
  "moto[server]>=5.2.2,<6",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing -n auto"
markers = [
  "integration: tests starting local protocol servers",
  "s3: tests requiring external S3 credentials",
  "slow: tests that are unusually slow",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError:",
]
omit = ["*/compat.py", "*/migrations/*"]
