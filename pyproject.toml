[project]
name = "storegate"
version = "0.1.0"
description = "Asynchronous multi-backend file storage and protocol gateway"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "wyf7685", email = "wyf7685@gmail.com" }]
maintainers = [{ name = "wyf7685", email = "wyf7685@gmail.com" }]
keywords = [
  "async",
  "storage",
  "webdav",
  "ftp",
  "sftp",
  "s3",
  "gateway",
  "filesystem",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: File Transfer Protocol (FTP)",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Filesystems",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

dependencies = [
  "anyio>=4.14.1",
  "expiringdictx>=1.1.0",
  "httpx[http2]>=0.28.1",
  "loguru>=0.7.3",
  "pydantic>=2.13.4",
]
[project.urls]
Homepage = "https://github.com/wyf7685/storegate"
Repository = "https://github.com/wyf7685/storegate"
Issues = "https://github.com/wyf7685/storegate/issues"

[project.optional-dependencies]
ftp-server = ["aioftp>=0.27.2"]
dav-server = ["a2wsgi>=1.10.10", "uvicorn[standard]>=0.50.2", "wsgidav>=4.3.5"]
ftp-storage = ["aioftp>=0.27.2"]
sftp-storage = ["asyncssh>=2.24.0"]
redis = ["redis>=8.0.1"]
standard = ["storegate[ftp-server,dav-server,ftp-storage,sftp-storage,redis]"]
ayafileio = ["ayafileio>=1.4.7"]
httpx2 = ["httpx2[http2]>=2.7.0,<3"]
uvloop = [
  "uvloop>=0.22.1 ; sys_platform != 'win32'",
  "winloop>=0.6.3 ; sys_platform == 'win32'",
]
full = ["storegate[standard,ayafileio,httpx2,uvloop]"]

[project.scripts]
storegate = "storegate.cli:main"

[dependency-groups]
dev = [
  "storegate[full]",
  { include-group = "lint" },
  { include-group = "test" },
]
lint = ["prek>=0.4.11", "ruff>=0.16.0", "ty>=0.0.65"]
test = [
  "storegate[standard]",
  "moto[server]>=5.2.2,<6",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=storegate --cov-report=term-missing -n auto"
markers = [
  "integration: tests starting local protocol servers",
  "s3: tests requiring external S3 credentials",
  "slow: tests that are unusually slow",
  "httpx: tests exercising storegate.utils.httpx for CI httpx/httpx2 matrix",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError:",
]
