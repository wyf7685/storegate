name: CI

on:
  push:
    branches:
      - master
    paths:
      - "storegate/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - "ty.toml"
      - "README.md"
  pull_request:
    paths:
      - "storegate/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "ruff.toml"
      - "ty.toml"
      - "README.md"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group lint

      - name: Run ruff check
        run: uv run --no-sync ruff check && uv run --no-sync ruff format --check

      - name: Run ty check
        run: uv run --no-sync ty check

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    concurrency:
      group: test-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --group test && uv run --no-sync python -c "from storegate.utils import httpx; assert httpx.__name__ == 'httpx', httpx.__name__"

      - name: Run tests
        run: uv run --no-sync pytest -m "not s3" --cov=storegate --cov-branch --cov-report=xml -rs

      - name: Install dependencies with httpx2
        if: runner.os == 'Linux'
        run: uv sync --no-dev --group test --extra httpx2 && uv run --no-sync python -c "from storegate.utils import httpx; assert httpx.__name__ == 'httpx2', httpx.__name__"

      - name: Run tests with httpx2
        if: runner.os == 'Linux'
        run: uv run --no-sync pytest -m "httpx and not s3" --no-cov

      - name: Upload coverage report
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
